</style></head><body><main><video id="film" muted loop playsinline preload="metadata" poster="poster.jpg"><source src="temple-cinematic.mp4" type="video/mp4"></video><div class="shade"></div><header><a class="brand" href="../cinematic.html"><span>ॐ</span>Sri Shivan Alayam</a><nav aria-label="Website"><a href="../cinematic.html#explore">Explore</a><a href="../cinematic.html#contact">Visit us</a></nav></header><div class="caption"><p id="chapter">A SACRED JOURNEY</p><h1 id="title">Beyond the everyday.</h1><small id="line">Into a world of peace and devotion.</small></div><div class="controls"><div><button id="play">Play film ▷</button><button id="replay" aria-label="Replay film">Replay ↺</button><button id="full" aria-label="Watch fullscreen">Fullscreen ⛶</button></div><a class="enter" href="../live/">Enter the interactive temple ⟶</a></div><p class="note">An original cinematic interpretation · Sri Shivan Alayam</p><div id="error" hidden><p>The film could not load.</p><a href="../cinematic.html">Explore the temple website →</a></div></main><script>
const video=document.querySelector('#film'),play=document.querySelector('#play'),motion=matchMedia('(prefers-reduced-motion: reduce)');
const sync=()=>{play.textContent=video.paused?'Play film ▷':'Pause film Ⅱ';play.setAttribute('aria-pressed',String(!video.paused));};
play.onclick=async()=>{if(video.paused){try{await video.play();}catch{sync();}}else video.pause();};video.onplay=sync;video.onpause=sync;
document.querySelector('#replay').onclick=async()=>{video.currentTime=0;try{await video.play();}catch{sync();}};
document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('main').requestFullscreen();}catch{if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();}};
video.ontimeupdate=()=>{const t=video.currentTime;document.querySelector('#chapter').textContent=t<4?'A SACRED JOURNEY':t<8?'FOLLOW THE LIGHT':'OM NAMAH SHIVAYA';document.querySelector('#title').textContent=t<4?'Beyond the everyday.':t<8?'A quiet invitation.':'A moment of stillness.';document.querySelector('#line').textContent=t<4?'Into a world of peace and devotion.':t<8?'Through the hall. Towards the sacred.':'Experience peace. Find yourself.';};
video.onerror=()=>document.querySelector('#error').hidden=false;video.querySelector('source').onerror=video.onerror;
if(!motion.matches)video.play().catch(sync);else sync();motion.addEventListener('change',e=>{if(e.matches)video.pause();});
let resume=false;document.addEventListener('visibilitychange',()=>{if(document.hidden){resume=!video.paused;video.pause();}else if(resume&&!motion.matches){video.play().catch(sync);}});
</script></body></html>
